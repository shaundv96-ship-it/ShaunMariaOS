<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <meta
    name="theme-color"
    content="#cc6f7b"
    >

    <title>Tasks · ShaunMariaOS</title>

    <link
        rel="stylesheet"
        href="/static/app.css"
    >
    <link
    rel="manifest"
    href="/static/manifest.json"
    >
    <meta
    name="apple-mobile-web-app-capable"
    content="yes"
>
<meta
    name="mobile-web-app-capable"
    content="yes"
>
<meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
>

<meta
    name="apple-mobile-web-app-title"
    content="S&M OS"
>
<link
    rel="apple-touch-icon"
    href="/static/icons/apple-touch-icon.png"
>
<link
    rel="icon"
    type="image/png"
    href="/static/icons/icon-192.png"
>
</head>

<body>

<div class="app-shell">

    <header class="topbar">

        <div>
            <p class="eyebrow">
                TASKSOS
            </p>

            <h1>
                Things to do.
            </h1>
        </div>

        <a
            href="/"
            class="avatar page-back"
        >
            S&M
        </a>

    </header>


    <main class="dashboard">

        <section class="task-summary">

            <p class="eyebrow">
                OPEN TASKS
            </p>

            <strong id="task-count">
                —
            </strong>

            <span>
                remaining
            </span>

        </section>


        <section
            id="task-list"
            class="task-list"
        >

            <article class="card">
                Loading TasksOS…
            </article>

        </section>


        <section class="calendar-quick-add">

            <p class="eyebrow">
                QUICK ADD
            </p>

            <h2>
                Add a task
            </h2>

            <div class="quick-add-box">

                <input
                    id="task-input"
                    type="text"
                    placeholder="What needs to be done?"
                    autocomplete="off"
                >

                <button
                    id="task-add-button"
                    type="button"
                >
                    +
                </button>

            </div>

            <div
                id="task-result"
                class="quick-add-result"
            ></div>

            <small>
                Try: Buy wedding shoes · Call mum · Pay SIM bill
            </small>

        </section>

    </main>


    <nav class="bottom-nav">

        <a href="/" class="nav-item">
            <span>⌂</span>
            <small>Home</small>
        </a>

        <a href="/calendar" class="nav-item">
            <span>▣</span>
            <small>Calendar</small>
        </a>

        <a href="/money" class="nav-item">
            <span>$</span>
            <small>Money</small>
        </a>

        <a href="/us" class="nav-item">
    <span>♥</span>
    <small>Us</small>
</a>

        <a
            href="/tasks"
            class="nav-item active"
        >
            <span>✓</span>
            <small>Tasks</small>
        </a>

    </nav>

</div>

<script src="/static/tasks.js"></script>
<script src="/static/pwa.js"></script>

</body>
</html>
