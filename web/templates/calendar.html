<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <meta
    name="theme-color"
    content="#cc6f7b"
    >

    <title>Calendar · ShaunMariaOS</title>

    <link
        rel="stylesheet"
        href="/static/app.css"
    >
    <link
    rel="manifest"
    href="/static/manifest.json"
    >
    <meta
    name="apple-mobile-web-app-capable"
    content="yes"
>
<meta
    name="mobile-web-app-capable"
    content="yes"
>

<meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
>

<meta
    name="apple-mobile-web-app-title"
    content="S&M OS"
>
<link
    rel="apple-touch-icon"
    href="/static/icons/apple-touch-icon.png"
>
<link
    rel="icon"
    type="image/png"
    href="/static/icons/icon-192.png"
>
</head>

<body>

<div class="app-shell">

    <header class="topbar calendar-topbar">

        <div>
            <p class="eyebrow">
                CALENDAROS
            </p>

            <h1>
                Our calendar.
            </h1>
        </div>

        <a
            href="/"
            class="avatar page-back"
            aria-label="Home"
        >
            S&M
        </a>

    </header>


    <main class="dashboard">

        <section class="calendar-date-card">

            <button
                id="previous-day"
                class="calendar-arrow"
                type="button"
            >
                ‹
            </button>

            <div class="calendar-date-center">
    <p
        id="calendar-weekday"
        class="eyebrow calendar-day-label"
    >
        TODAY
    </p>

    <h2 id="calendar-date-title">
        Loading…
    </h2>

            <button
                id="today-button"
                class="today-button"
                type="button"
    >
            Today
            </button>
        </div>

            <button
                id="next-day"
                class="calendar-arrow"
                type="button"
            >
                ›
            </button>

        </section>


        <section
            id="calendar-events"
            class="today-events calendar-events-list"
        >

            <article class="card schedule-card">
                <div>
                    <strong>
                        Loading calendar…
                    </strong>
                </div>
            </article>

        </section>


        <section class="calendar-quick-add">

            <p class="eyebrow">
                QUICK ADD
            </p>

            <h2>
                Add something
            </h2>

    <div class="quick-add-box">

        <input
            id="quick-add-input"
            type="text"
            placeholder="What would you like to add?"
                autocomplete="off"
        >

        <button
            id="quick-add-button"
            type="button"
            aria-label="Add calendar event"
        >
        +
        </button>

        </div>

        <div
            id="quick-add-result"
            class="quick-add-result"
            aria-live="polite"
        ></div>
            <small>
                Try: Dinner tomorrow 7pm · JB trip 9–11 Oct · Gym every Monday 7pm
            </small>

        </section>

    </main>


    <nav class="bottom-nav">

        <a
            href="/"
            class="nav-item"
        >
            <span>⌂</span>
            <small>Home</small>
        </a>

        <a
            href="/calendar"
            class="nav-item active"
        >
            <span>▣</span>
            <small>Calendar</small>
        </a>

        <a
            href="/money"
            class="nav-item"
>
            <span>$</span>
            <small>Money</small>
        </a>

        <a href="/us" class="nav-item">
    <span>♥</span>
    <small>Us</small>
</a>

       <a
    href="/tasks"
    class="nav-item"
>
    <span>✓</span>
    <small>Tasks</small>
</a>

    </nav>

</div>


<script src="/static/calendar.js"></script>
<script src="/static/pwa.js"></script>

</body>
</html>
